<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Tutor</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px; }
  #chat { border: 1px solid #ccc; border-radius: 8px; height: 55vh; overflow-y: auto; padding: 12px; margin: 12px 0; }
  .me { color: #0a58ca; margin: 8px 0; }
  .ai { white-space: pre-wrap; margin: 8px 0 16px; }
  .row { display: flex; gap: 8px; }
  input[type=text] { flex: 1; padding: 10px; }
  button { padding: 10px 16px; cursor: pointer; }
</style>
</head>
<body>
<h2>PDF Tutor</h2>
<input type="file" id="pdf" accept="application/pdf">
<button onclick="upload()">Upload PDF</button>
<div id="status">Upload a PDF to begin.</div>

<div id="chat"></div>
<div class="row">
  <input type="text" id="q" placeholder="Ask a doubt about the PDF..." onkeydown="if(event.key==='Enter')send()">
  <button onclick="send()">Ask</button>
</div>

<script>
let docId = null;
let history = [];

async function upload() {
  const f = document.getElementById('pdf').files[0];
  if (!f) return;
  const status = document.getElementById('status');
  status.textContent = 'Reading and indexing... (this can take a minute)';
  const fd = new FormData();
  fd.append('file', f);
  const r = await fetch('/upload', { method: 'POST', body: fd });
  if (!r.ok) { status.textContent = 'Upload failed.'; return; }
  const data = await r.json();
  docId = data.doc_id;
  history = [];
  status.textContent = 'Ready. Indexed ' + data.chunks + ' chunks.';
}

async function send() {
  const input = document.getElementById('q');
  const question = input.value.trim();
  if (!question || !docId) return;
  input.value = '';
  const chat = document.getElementById('chat');
  chat.insertAdjacentHTML('beforeend', '<div class="me"></div><div class="ai"></div>');
  const me = chat.querySelectorAll('.me'); const ai = chat.querySelectorAll('.ai');
  me[me.length - 1].textContent = 'You: ' + question;
  const out = ai[ai.length - 1];

  // live timer so you can tell "working" from "stuck"
  const t0 = Date.now();
  out.textContent = '⏳ Model is working... 0s (first answer can take up to 1-2 min)';
  const timer = setInterval(() => {
    const s = Math.round((Date.now() - t0) / 1000);
    out.textContent = '⏳ Model is working... ' + s + 's (first answer can take up to 1-2 min)';
  }, 1000);

  const r = await fetch('/ask', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ doc_id: docId, question, history })
  });
  const reader = r.body.getReader();
  const dec = new TextDecoder();
  let answer = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    if (!answer) clearInterval(timer);  // first word arrived
    answer += dec.decode(value);
    out.textContent = answer;
    chat.scrollTop = chat.scrollHeight;
  }
  clearInterval(timer);
  out.textContent = answer + '\n\n(answered in ' + Math.round((Date.now() - t0) / 1000) + 's)';
  history.push({ role: 'user', content: question }, { role: 'assistant', content: answer });
}
</script>
</body>
</html>
